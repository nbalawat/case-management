# One command on a Mac with Docker Desktop:  docker compose up --build
# Then open http://localhost:8000
#
# With the event backbone (Kafka, the outbox relay and the stream consumers):  make backbone
# With Debezium publishing the outbox instead of the relay:                    make backbone-cdc
# Everything: Kafka, the lake, OpenSearch, the graph engine and Temporal:      make full
# Everything plus stream detection on Apache Flink:                            make streaming
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caseforge
      POSTGRES_PASSWORD: caseforge-local-only
      POSTGRES_DB: caseforge
    command: ["postgres", "-c", "wal_level=logical"]  # lets Debezium read the outbox from the database log; harmless otherwise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseforge"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://caseforge:caseforge-local-only@db:5432/caseforge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # optional: a model behind the Ask page and the agents
      OPEN_MODEL_URL: ${OPEN_MODEL_URL:-}        # optional: an open-weight model on vLLM or Ollama, e.g. http://host.docker.internal:11434/v1
      OPEN_MODEL: ${OPEN_MODEL:-}
      AGENT_MODE: ${AGENT_MODE:-rules}           # model: the specialist agents run on the model, with the rules as fallback
      EVENT_BUS_URL: ${EVENT_BUS_URL:-}          # empty: events wait in the outbox table
      OUTBOX_PUBLISHER: ${OUTBOX_PUBLISHER:-relay}
      SEARCH_URL: ${SEARCH_URL:-}                # empty: names are searched in the database
      LAKE_CATALOG: ${LAKE_CATALOG:-}            # empty: no lake; make backbone sets an Iceberg catalog in Postgres
      GRAPH_URL: ${GRAPH_URL:-}                  # empty: routes between customers are found in the database
      TEMPORAL_URL: ${TEMPORAL_URL:-}            # empty: stage clocks are checked by the sweep only
      FLINK_URL: ${FLINK_URL:-}                  # empty: no stream processor; scenarios run in the stream consumer
      FLINK_GATEWAY_URL: ${FLINK_GATEWAY_URL:-}  # Flink's SQL Gateway: start and stop jobs from the Integrations page
    ports: ["8000:8000"]
    volumes: [evidence:/app/data/evidence, warehouse:/app/data/warehouse]  # customer documents and lake tables outlive the container
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/tenants')"]
      interval: 5s
      retries: 60

  # ---- the event backbone: docker compose --profile backbone
  kafka:
    profiles: [backbone]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]  # from the Mac itself: localhost:29092
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30
  worker:  # the outbox relay, the inbound stream consumers and the lake writer, beside the API
    profiles: [backbone]
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "app.backbone.worker"]
    environment:
      <<: *app-env
      EVENT_BUS_URL: kafka://kafka:9092
    volumes: [warehouse:/app/data/warehouse]  # the API reads the same lake tables to show their totals
    depends_on:
      app: {condition: service_healthy}  # the API creates the schema and the demo clients
      kafka: {condition: service_healthy}

  # ---- name search on OpenSearch: docker compose --profile search, with SEARCH_URL=opensearch://opensearch:9200
  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"       # a laptop demo on a private Docker network; a deployment keeps security on
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [searchdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 5s
      retries: 40

  # ---- durable stage clocks on Temporal: docker compose --profile durable, with TEMPORAL_URL=temporal://temporal:7233
  temporal:  # the development server: one process, its state in a file on a volume. A deployment runs a Temporal cluster.
    profiles: [durable]
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    user: root  # the volume is created owned by root
    ports: ["8233:8233"]  # Temporal's own console
    volumes: [temporaldata:/data]
  durable-worker:  # runs the clock workflows and keeps them in step with the database
    profiles: [durable]
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "app.durable.worker"]
    environment:
      <<: *app-env
      TEMPORAL_URL: temporal://temporal:7233
    restart: on-failure  # Temporal may still be starting
    depends_on:
      app: {condition: service_healthy}  # the API creates the schema and the demo clients
      temporal: {condition: service_started}

  # ---- the payment network on Apache AGE: docker compose --profile graph, with GRAPH_URL=age://caseforge:caseforge-local-only@graph:5432/graph
  graph:
    profiles: [graph]
    image: apache/age:release_PG16_1.5.0
    environment:
      POSTGRES_USER: caseforge
      POSTGRES_PASSWORD: caseforge-local-only
      POSTGRES_DB: graph
    volumes: [graphdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseforge -d graph"]
      interval: 3s
      retries: 20

  # ---- stream detection on Apache Flink: docker compose --profile streaming, with FLINK_URL=http://flink-jobmanager:8081
  # A client's job is rendered and submitted with:  make flink-job CLIENT=meridian   (see deploy/flink/README.md)
  flink-jobmanager:
    profiles: [streaming]
    build: ./deploy/flink
    command: jobmanager
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        rest.bind-address: 0.0.0.0
    ports: ["8081:8081"]  # Flink's own console
    volumes: ["./deploy/flink/jobs:/jobs"]  # rendered jobs, one file per client
    depends_on:
      kafka: {condition: service_healthy}
  flink-taskmanager:
    profiles: [streaming]
    build: ./deploy/flink
    command: taskmanager
    environment: *flink-env
    depends_on: [flink-jobmanager]
  # Flink's own SQL Gateway. The application submits a client's rendered job through it (FLINK_GATEWAY_URL).
  flink-sql-gateway:
    profiles: [streaming]
    build: ./deploy/flink
    command: ["bin/sql-gateway.sh", "start-foreground", "-Dsql-gateway.endpoint.rest.address=0.0.0.0", "-Drest.address=flink-jobmanager"]
    depends_on: [flink-jobmanager]

  # ---- Debezium publishes the outbox instead of the relay: add --profile cdc and OUTBOX_PUBLISHER=debezium
  connect:
    profiles: [cdc]
    image: quay.io/debezium/connect:3.0
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: caseforge-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: caseforge
      DB_PASSWORD: caseforge-local-only
      DB_NAME: caseforge
    ports: ["8083:8083"]
    depends_on:
      app: {condition: service_healthy}  # the outbox table must exist before the connector looks for it
      kafka: {condition: service_healthy}
  connect-setup:  # registers the connector once, then exits
    profiles: [cdc]
    image: curlimages/curl:8.11.1
    volumes: ["./deploy/debezium:/config:ro"]
    command: ["sh", "-c", "until curl -sf http://connect:8083/connectors > /dev/null; do sleep 3; done; curl -sf -X PUT -H 'Content-Type: application/json' --data @/config/outbox-connector.json http://connect:8083/connectors/caseforge-outbox/config"]
    depends_on: [connect]
volumes:
  pgdata:
  kafkadata:
  warehouse:
  searchdata:
  graphdata:
  temporaldata:
  evidence:
