# One command on a Mac with Docker Desktop:  docker compose up --build
# Then open http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caseforge
      POSTGRES_PASSWORD: caseforge-local-only
      POSTGRES_DB: caseforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseforge"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://caseforge:caseforge-local-only@db:5432/caseforge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # optional: a model behind the Ask page
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
