# Alerting rules an operations team starts from. Thresholds are starting points, to be tuned per deployment.
groups:
  - name: caseforge
    rules:
      - alert: CaseForgeTargetDown
        expr: up{job=~"caseforge-.*"} == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.job }} on {{ $labels.instance }} has not answered a scrape for 2 minutes"}
      - alert: CaseForgeApiErrors
        expr: sum(rate(caseforge_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(caseforge_http_requests_total[5m])), 1e-9) > 0.02
        for: 5m
        labels: {severity: page}
        annotations: {summary: "More than 2% of API requests are failing"}
      - alert: CaseForgeApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(caseforge_http_request_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "The API's 95th percentile response time has been over 2 s for 10 minutes"}
      - alert: CaseForgeOutboxBacklog
        expr: max(caseforge_outbox_oldest_waiting_seconds) > 300
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Events have waited in the outbox for more than 5 minutes: the relay or the bus is not moving them"}
      - alert: CaseForgeStreamRejects
        expr: sum by (tenant) (rate(caseforge_stream_messages_total{outcome="rejected"}[10m])) > 1
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "{{ $labels.tenant }}'s stream is sending records to the dead-letter topic"}
      - alert: CaseForgeOverdueCases
        expr: sum by (tenant) (caseforge_cases{status="overdue"}) > 0
        for: 1h
        labels: {severity: ticket}
        annotations: {summary: "{{ $labels.tenant }} has cases open past their deadline"}
