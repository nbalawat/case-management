# Scrapes the API and the backbone worker in the Compose stack (make observability). A deployment points its own
# Prometheus (or Grafana Agent, or a cloud's managed Prometheus) at the same /metrics endpoints; the Helm chart
# annotates the pods for that.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: caseforge-api
    metrics_path: /metrics
    static_configs: [{targets: ["app:8000"]}]
  - job_name: caseforge-worker
    static_configs: [{targets: ["worker:9100"]}]
