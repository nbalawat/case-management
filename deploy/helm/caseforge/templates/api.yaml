apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caseforge.name" . }}-api
  labels: {{- include "caseforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "caseforge.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "caseforge.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "caseforge.pod" . | nindent 6 }}
      containers:
        - name: api
          {{- include "caseforge.container" . | nindent 10 }}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /api/tenants, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/tenants, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/tenants, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caseforge.name" . }}
  labels: {{- include "caseforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "caseforge.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "caseforge.name" . }}-api
  labels: {{- include "caseforge.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "caseforge.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "caseforge.name" . }}-api
  labels: {{- include "caseforge.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "caseforge.name" . }}-api}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
