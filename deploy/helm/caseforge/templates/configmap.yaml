{{- include "caseforge.checks" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caseforge.name" . }}-env
  labels: {{- include "caseforge.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ .Values.publicUrl | quote }}
  SCHEMA_ON_MISMATCH: {{ .Values.schemaOnMismatch | quote }}
  DATABASE_ROLE: {{ .Values.databaseRole | quote }}
  MIGRATE_ON_START: {{ ternary "0" "1" .Values.migrations.job | quote }}
  DEMO_TENANTS: {{ ternary "1" "0" .Values.demoTenants | quote }}
  AUTH_MODE: {{ .Values.auth.mode | quote }}
  OIDC_OPERATOR_ISSUER: {{ .Values.auth.operatorIssuer | quote }}
  OIDC_OPERATOR_AUDIENCE: {{ .Values.auth.operatorAudience | quote }}
  OIDC_OPERATOR_CLAIM: {{ .Values.auth.operatorClaim | quote }}
  EVENT_BUS_URL: {{ .Values.eventBus.url | quote }}
  EVENT_TOPIC_PREFIX: {{ .Values.eventBus.topicPrefix | quote }}
  OUTBOX_PUBLISHER: {{ .Values.eventBus.outboxPublisher | quote }}
  BACKBONE_WORKERS: "0"    # the worker Deployment does this, never the API pods
  PIPELINE_SCHEDULER: "0"  # an in-process timer is wrong with more than one API pod
  SEARCH_URL: {{ .Values.search.url | quote }}
  TEMPORAL_URL: {{ .Values.temporal.url | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  WORKFLOW_ENGINE: {{ .Values.temporal.engine | quote }}
  TEMPORAL_NAMESPACE_MODE: {{ .Values.temporal.namespaceMode | quote }}
  TEMPORAL_NAMESPACE_PREFIX: {{ .Values.temporal.namespacePrefix | quote }}
  TEMPORAL_RETENTION_DAYS: {{ .Values.temporal.retentionDays | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  FLINK_URL: {{ .Values.flink.url | quote }}
  FLINK_GATEWAY_URL: {{ .Values.flink.gatewayUrl | quote }}
  {{- with .Values.storage.evidenceUrl }}
  EVIDENCE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.quarantineUrl }}
  QUARANTINE_URL: {{ . | quote }}
  {{- end }}
  METRICS_PORT: {{ .Values.observability.metricsPort | quote }}
  LOG_FORMAT: {{ .Values.observability.logFormat | quote }}
  {{- with .Values.observability.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  AGENT_MODE: {{ .Values.llm.agentMode | quote }}
  ASK_PROVIDER: {{ .Values.llm.askProvider | quote }}
  {{- with .Values.llm.askModel }}
  ASK_MODEL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
