# One release is one stamp: the application tier for one client (dedicated) or a pool of clients (SaaS).
# The chart deploys the application only. Postgres, Kafka, OpenSearch, Temporal, Flink and object storage are
# addressed by URL: run them with their own operators or use managed services. See README.md and modes/.

image:
  repository: caseforge
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Secrets are never written into values. Name an existing Secret; every key in it becomes an environment variable.
# It must hold DATABASE_URL, and may hold TEMPORAL_ENCRYPTION_KEY, ANTHROPIC_API_KEY, KAFKA_CONFIG, SEARCH_CONFIG, GRAPH_URL, LAKE_CATALOG.
existingSecret: ""

publicUrl: http://localhost:8000

api:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# What happens to a database from before versioned migrations existed that is too old to adopt. `refuse` stops with
# an explanation. `rebuild` drops every table and starts again: it exists for demos and must never meet real data.
schemaOnMismatch: refuse

# Postgres row-level security keeps every client to its own rows in the database itself, under the application's own
# filter. Requests run as this role (SET LOCAL ROLE), which the application creates with no superuser or BYPASSRLS
# right, because Postgres lets those past every policy. The database user in the secret needs CREATEROLE once, or an
# administrator creates the role (NOLOGIN NOBYPASSRLS) and grants it to that user. Empty: requests run as the user in
# DATABASE_URL, and the health check says whether row-level security binds it.
databaseRole: caseforge_app

# Schema changes are versioned migrations. With the job on (the default), a hook runs `python -m app.migrate` before
# each install and upgrade, and the pods refuse to start against a database that is behind. With it off, the pods
# migrate as they start, taking a database lock so only one does the work.
migrations:
  job: true
  timeoutSeconds: 600

# Demo clients and their synthetic data. Off for anything but a demo.
demoTenants: false

auth:
  mode: oidc            # oidc | demo. Demo mode lets anyone pick any person; never expose it.
  operatorIssuer: ""
  operatorAudience: caseforge
  operatorClaim: preferred_username

eventBus:
  url: ""               # kafka://broker:9092,broker2:9092. Empty: events wait in the outbox and no worker is deployed.
  topicPrefix: caseforge
  outboxPublisher: relay   # relay | debezium
  worker:
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 384Mi}
      limits: {memory: 768Mi}

search:
  url: ""               # opensearch://host:9200. Empty: names are searched in the database.

temporal:
  url: ""               # temporal://host:7233. Set: every case runs as a durable workflow on it. Empty: case workflows run in the application, the sweep checks stage clocks, and no worker is deployed.
  engine: ""            # builtin | temporal. Empty: temporal when url is set.
  namespaceMode: per_client  # per_client: each client in namespace <namespacePrefix><client id>, registered on first use. shared: everyone in `namespace`.
  namespacePrefix: caseforge-
  namespace: default    # the shared namespace (namespaceMode: shared)
  retentionDays: 30     # how long Temporal keeps a finished workflow's history (the case's own audit trail is in the database, for good)
  taskQueue: caseforge
  # Payload encryption: everything a workflow carries is sealed with AES-GCM before Temporal sees it, with a key per namespace
  # (so a key per client in per_client mode) derived from TEMPORAL_ENCRYPTION_KEY in existingSecret. auto: encrypt when the
  # Secret holds the key. required: refuse to run without it. off: never. Raise keyVersion to rotate; older history stays readable.
  encryption: auto
  keyVersion: 1
  worker:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}

flink:
  url: ""               # http://flink-jobmanager:8081. Shows job status on the Integrations page.
  gatewayUrl: ""        # http://flink-sql-gateway:8083. With it, jobs are started and stopped from that page.

storage:
  evidenceUrl: ""       # s3://bucket/prefix, abfss://..., gs://... Required: pods keep nothing on local disk.
  quarantineUrl: ""

llm:
  agentMode: rules      # rules | model
  askProvider: auto
  askModel: ""

# Extra environment variables, as a map. For anything the chart has no value for.
extraEnv: {}

# Extra volumes and mounts on every pod, for example a CA bundle from a Secret for a data service with its own CA.
extraVolumes: []
extraVolumeMounts: []

# Extra labels on every pod. Azure workload identity needs azure.workload.identity/use: "true".
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}       # workload identity: eks.amazonaws.com/role-arn, azure.workload.identity/client-id, iam.gke.io/gcp-service-account

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""

networkPolicy:
  enabled: false        # when on: pods accept traffic only from the ingress namespace below, and only on the API port
  ingressNamespace: ingress-nginx
  monitoringNamespace: ""  # when set, Prometheus in this namespace may also scrape the metrics port

observability:
  metricsPort: 9100     # every pod serves Prometheus metrics here, a port no ingress routes to
  scrapeAnnotations: true  # prometheus.io/scrape, port and path on the pods, for Prometheus set to discover them
  logFormat: json       # one JSON object per line, with request id, client and trace id
  otlpEndpoint: ""      # an OpenTelemetry Collector, Jaeger or Tempo (http://collector:4318); empty: no traces

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true   # the application writes only to /tmp and /app/data, both emptyDirs
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
