{{- if .Values.kafka.enabled }}
{{- $k := .Values.kafka }}
# KRaft Kafka: one node pool of combined controllers and brokers, TLS-only listener with SCRAM-SHA-512, ACLs on.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $k.name }}-nodes
  labels:
    {{- include "data.labels" . | nindent 4 }}
    strimzi.io/cluster: {{ $k.name }}
spec:
  replicas: {{ $k.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ $k.storageGi }}Gi
        deleteClaim: false
        kraftMetadata: shared
        {{- with $k.storageClass }}
        class: {{ . }}
        {{- end }}
  resources: {{- toYaml $k.resources | nindent 4 }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ $k.name }}
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  kafka:
    version: {{ $k.version | quote }}
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: {{ min 3 $k.replicas }}
      min.insync.replicas: {{ max 1 (sub (min 3 $k.replicas) 1) }}
      offsets.topic.replication.factor: {{ min 3 $k.replicas }}
      transaction.state.log.replication.factor: {{ min 3 $k.replicas }}
      transaction.state.log.min.isr: {{ max 1 (sub (min 3 $k.replicas) 1) }}
      auto.create.topics.enable: false
      unclean.leader.election.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The application's user: SCRAM credentials generated by Strimzi into the Secret of the same name, and ACLs on the
# application's topic prefix and consumer groups only.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: caseforge
  labels:
    {{- include "data.labels" . | nindent 4 }}
    strimzi.io/cluster: {{ $k.name }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: {{ $k.topicPrefix | quote }}, patternType: prefix}
        operations: [Create, Describe, DescribeConfigs, Read, Write]
      - resource: {type: group, name: {{ $k.topicPrefix | quote }}, patternType: prefix}
        operations: [Describe, Read]
      - resource: {type: cluster}
        operations: [Describe]
{{- end }}
