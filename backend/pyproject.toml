[project]
name = "caseforge-backend"
version = "0.1.0"
description = "CaseForge demo backend: ingestion, detection, alert hub, case core, agents, reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "fsspec>=2024.6",
  "pyarrow>=16",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "moto[server]>=5", {include-group = "llm"}, {include-group = "s3"}]
# The hosted model behind "ask anything". Without it the app uses the offline planner.
llm = ["anthropic>=1.0"]
# One driver per cloud for data pipelines. Install only the ones a deployment reads from; local directories need none.
s3 = ["s3fs>=2024.6"]
adls = ["adlfs>=2024.4"]
gcs = ["gcsfs>=2024.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
