[project]
name = "caseforge-backend"
version = "0.1.0"
description = "CaseForge demo backend: ingestion, detection, alert hub, case core, agents, reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "fsspec>=2024.6",
  "pyarrow>=16",
  "pyjwt[crypto]>=2.15.1",
  # The model gateway's adapter for open-weight models on vLLM, Ollama or any OpenAI-compatible server.
  "httpx>=0.27",
  # Form data is validated against the JSON Schema each form compiles to.
  "jsonschema>=4.23",
  # 49 and later ship no Intel macOS wheel, and building from source needs a recent Rust.
  "cryptography>=44,<51",
  "xmlschema>=4.3.2",
  "prometheus-client>=0.21",
  "anyascii>=0.3.3",
  "mcp>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "moto[server]>=5",
    "time-machine>=2.15",
    {include-group = "llm"},
    {include-group = "s3"},
    {include-group = "aws"},
    {include-group = "adls"},
    {include-group = "gcs"},
    {include-group = "kafka"},
    {include-group = "lake"},
    {include-group = "search"},
    {include-group = "durable"},
    {include-group = "tracing"},
    {include-group = "ml"},
]
# The hosted model behind "ask anything". Without it the app uses the offline planner.
llm = ["anthropic>=1.0"]
# The event bus on Kafka or anything that speaks its protocol. Without it, events wait in the outbox table.
kafka = ["confluent-kafka>=2.6"]
# History in Apache Iceberg tables. The catalog is configuration: a SQL catalog on a laptop, a REST catalog (Polaris, Nessie) in a deployment.
lake = ["pyiceberg[sql-sqlite,pyiceberg-core]>=0.9", "duckdb>=1.3"]
# Name search on OpenSearch. Without it, names are searched in the database.
search = ["opensearch-py>=2.6"]
# Traces over OTLP (OTEL_EXPORTER_OTLP_ENDPOINT) to Jaeger, Tempo or any OpenTelemetry Collector.
tracing = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30", "opentelemetry-instrumentation-fastapi>=0.51b0"]
# Durable stage clocks on Temporal (TEMPORAL_URL).
durable = ["temporalio>=1.9"]
# One driver per cloud for data pipelines. Install only the ones a deployment reads from; local directories need none.
s3 = ["s3fs>=2024.6"]
adls = ["adlfs>=2024.4"]
gcs = ["gcsfs>=2024.6"]
# Per-client keys in AWS KMS (KEY_PROVIDER=aws-kms).
aws = ["boto3>=1.34"]
# Models that rank alerts (scikit-learn). Without it the registry and feature store work and training says what is missing.
ml = ["scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
