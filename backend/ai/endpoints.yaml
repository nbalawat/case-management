# The models this deployment can reach. Each client's model policy picks from these by id (see app/ai/policy.py),
# so adding a model is configuration, not code. Secrets never live here: an endpoint names the environment
# variable that holds its key, and is only offered once that variable is set.
#
#   kind      anthropic (Claude through the Anthropic API) or openai (any server speaking the OpenAI chat
#             completions protocol: vLLM, Ollama, LiteLLM, llama.cpp, TGI, a cloud's open-weight endpoint)
#   region    where inference runs, checked against a client's residency rule. "local" means this machine or network.
#   price     US dollars per million input and output tokens, for the spend figures. Leave it out to show tokens only.
#   needs     environment variables that must be set before the endpoint is offered
endpoints:
  claude:
    kind: anthropic
    label: Claude Opus 5.5 (Anthropic API)
    model: claude-opus-5-5
    model_env: ASK_MODEL          # an override kept from the first release
    effort_env: ASK_EFFORT
    effort: medium
    api_key_env: ANTHROPIC_API_KEY
    needs: [ANTHROPIC_API_KEY]
    region: us
    inference_geo: us             # ask the API to run inference in this geography
    price: {input: 4.00, output: 20.00}
  claude-sonnet:
    kind: anthropic
    label: Claude Sonnet 5.5 (Anthropic API)
    model: claude-sonnet-5-5
    effort: medium
    api_key_env: ANTHROPIC_API_KEY
    needs: [ANTHROPIC_API_KEY]
    region: us
    inference_geo: us
    price: {input: 2.00, output: 10.00}
  open-weight:
    kind: openai
    label: Open-weight model (vLLM, Ollama or any OpenAI-compatible server)
    base_url_env: OPEN_MODEL_URL  # for example http://localhost:11434/v1 (Ollama) or http://vllm:8000/v1
    model_env: OPEN_MODEL         # for example qwen3:14b or meta-llama/Llama-3.3-70B-Instruct
    model: qwen3:14b
    api_key_env: OPEN_MODEL_KEY   # optional; most self-hosted servers need none
    needs: [OPEN_MODEL_URL]
    region: local
    price: {input: 0, output: 0}
