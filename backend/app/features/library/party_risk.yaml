# Behaviour and history of one customer, as of a moment. Every window ends just before that moment, so a feature
# computed for an alert raised at 10:00 sees nothing from 10:00 on: training data never leaks the future.
id: party_risk
title: Customer behaviour and history
entity: party
version: "1.0"
description: What a customer has done in the last weeks and how earlier concerns about them ended.
features:
  - {name: txn_count_30d, label: Payments in 30 days, source: transactions, agg: count, window_days: 30}
  - {name: value_in_30d, label: Value received in 30 days, source: transactions, agg: sum, field: amount, window_days: 30, where: {direction: in}}
  - {name: value_out_30d, label: Value sent in 30 days, source: transactions, agg: sum, field: amount, window_days: 30, where: {direction: out}}
  - {name: cash_in_30d, label: Cash deposited in 30 days, source: transactions, agg: sum, field: amount, window_days: 30, where: {direction: in, channel: cash}}
  - {name: near_threshold_cash_30d, label: "Cash deposits between 8,000 and 10,000 in 30 days", source: transactions, agg: count, window_days: 30,
     where: {direction: in, channel: cash, amount_from: 8000, amount_below: 10000}}
  - {name: high_risk_country_30d, label: Payments with higher-risk countries in 30 days, source: transactions, agg: count, window_days: 30, where: {counterparty_country: high_risk}}
  - {name: max_payment_30d, label: Largest payment in 30 days, source: transactions, agg: max, field: amount, window_days: 30}
  - {name: counterparties_30d, label: Distinct counterparties in 30 days, source: transactions, agg: count_distinct, field: counterparty, window_days: 30}
  - {name: txn_count_90d, label: Payments in 90 days, source: transactions, agg: count, window_days: 90}
  - {name: alerts_90d, label: Alerts in 90 days, source: alerts, agg: count, window_days: 90}
  - {name: confirmed_concerns, label: Earlier cases that ended in a filing or confirmed concern, source: cases, agg: count, where: {outcome: positive}}
  - {name: risk_level, label: Customer risk rating (0 low to 2 high), source: party, field: risk_rating}
  - {name: pep, label: Politically exposed person, source: party, field: pep}
  - {name: tenure_days, label: Days since onboarding, source: party, field: onboarded}
