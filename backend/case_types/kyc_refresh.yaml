case_type: kyc_refresh
title: KYC periodic refresh
domain: KYC
version: 3.0.0
scenarios: []
initial_state: outreach

states:
  outreach:
    label: Customer outreach
    kind: wait
    queue: kyc
    sla_hours: 336
  review:
    label: Analyst review
    queue: kyc
    sla_hours: 72
    tasks:
      - {id: identity, label: Identity documents current and verified}
      - {id: address, label: Proof of address}
      - {id: occupation, label: Occupation and expected activity confirmed}
      - {id: screening, label: Sanctions and PEP screening re-run}
  edd:
    label: Enhanced due diligence
    queue: kyc-edd
    sla_hours: 120
    tasks:
      - {id: source_of_funds, label: Source of funds evidenced}
      - {id: source_of_wealth, label: Source of wealth evidenced}
  approved: {label: Refreshed, kind: closed, disposition: refreshed}
  exit:     {label: Exit recommended, kind: closed, disposition: exit}

transitions:
  - {from: outreach, to: review, label: Documents received, roles: [kyc_analyst], requires: [requests_answered]}
  - from: review
    to: approved
    label: Approve refresh
    roles: [kyc_analyst]
    requires: [tasks, note]
    when: ["risk_rating != high", "pep == false"]
  - {from: review, to: edd, label: Escalate to EDD, roles: [kyc_analyst], requires: [tasks]}
  - {from: edd, to: approved, label: Approve after EDD, roles: [mlro, team_lead], requires: [tasks, note], four_eyes: true}
  - {from: edd, to: exit, label: Recommend exit, roles: [mlro], requires: [note]}

sla:
  clock: Periodic review due
  due_days: 45
agents:
  on_create: [data_assembly, entity_research]
  autonomy: L2
