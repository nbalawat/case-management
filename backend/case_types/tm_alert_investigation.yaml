case_type: tm_alert_investigation
title: Transaction monitoring investigation
domain: AML
version: 4.0.0
scenarios: [structuring, rapid_movement, high_risk_geo]
initial_state: triage

states:
  triage:
    label: Triage
    queue: aml-l1
    sla_hours: 48
    tasks:
      - {id: review_briefing, label: Review the alert and agent briefing}
      - {id: check_history, label: Check prior cases and filings on the customer}
  investigation:
    label: Investigation
    queue: aml-l2
    sla_hours: 120
    tasks:
      - {id: review_transactions, label: Review alerted transactions against the customer profile}
      - {id: counterparties, label: Research counterparties and jurisdictions}
      - {id: adverse_media, label: Adverse media check, required: false}
  awaiting_information:
    label: Awaiting information
    kind: wait
    queue: aml-l2
    sla_hours: 240
  sar_drafting:
    label: SAR drafting
    queue: aml-l2
    sla_hours: 72
    tasks:
      - {id: five_ws, label: Narrative covers who, what, when, where and why}
      - {id: amounts, label: Amounts and dates reconcile to the transactions}
  mlro_review:
    label: MLRO review
    queue: mlro
    sla_hours: 48
  senior_approval:
    label: Head of FIU approval
    queue: senior-approval
    sla_hours: 24
  filed:         {label: SAR filed, kind: closed, disposition: sar_filed}
  closed_no_sar: {label: Closed, no SAR, kind: closed, disposition: no_sar}

transitions:
  - {from: triage, to: investigation, label: Escalate to investigation, roles: [analyst, investigator], requires: [tasks]}
  - {from: triage, to: closed_no_sar, label: Close as not suspicious, roles: [analyst, investigator], requires: [tasks, note, reason]}
  - {from: investigation, to: awaiting_information, label: Park for information, roles: [investigator], requires: [open_request]}
  - {from: awaiting_information, to: investigation, label: Resume investigation, roles: [investigator], requires: [requests_answered]}
  - {from: investigation, to: sar_drafting, label: Recommend SAR, roles: [investigator], requires: [tasks]}
  - {from: investigation, to: closed_no_sar, label: Close, no SAR, roles: [investigator], requires: [tasks, note, reason]}
  - {from: sar_drafting, to: mlro_review, label: Submit for MLRO review, roles: [investigator], requires: [tasks, narrative]}
  # Ordinary filings: the MLRO approves and files.
  - from: mlro_review
    to: filed
    label: Approve and file SAR
    roles: [mlro]
    requires: [narrative]
    four_eyes: true
    when: ["alerted_amount < 100000", "pep == false"]
  # High-value or politically exposed: a second approval is mandatory.
  - from: mlro_review
    to: senior_approval
    label: Approve and send to Head of FIU
    roles: [mlro]
    requires: [narrative]
    four_eyes: true
    when: [{any: ["alerted_amount >= 100000", "pep == true"]}]
  - {from: mlro_review, to: sar_drafting, label: Return for rework, roles: [mlro], requires: [note]}
  - {from: senior_approval, to: filed, label: Final approval and file SAR, roles: [head_fiu], requires: [narrative], four_eyes: true}
  - {from: senior_approval, to: mlro_review, label: Return to MLRO, roles: [head_fiu], requires: [note]}

sla:
  clock: SAR filing deadline
  due_days: 30
escalation:
  raise_priority: true
  notify: team_lead
qa:
  sample_rate: 0.35
  dispositions: [no_sar]
  reopen_to: investigation
agents:
  on_create: [data_assembly, entity_research, adverse_media, typology_analyst, narrative_writer, qa_critic]
  autonomy: L2
