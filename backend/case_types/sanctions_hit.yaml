case_type: sanctions_hit
title: Sanctions screening hit
version: 1.4.0
scenarios: [sanctions_name]
initial_state: adjudication
states:
  adjudication:   {label: Adjudication, kind: open}
  escalated:      {label: Escalated to sanctions officer, kind: open}
  blocked:        {label: Blocked and reported, kind: closed, disposition: true_match}
  discounted:     {label: Discounted, kind: closed, disposition: false_positive}
transitions:
  - {from: adjudication, to: discounted, label: Discount as false positive, roles: [analyst, investigator], requires: [note]}
  - {from: adjudication, to: escalated, label: Escalate possible match, roles: [analyst, investigator]}
  - {from: escalated, to: blocked, label: Confirm match and block, roles: [mlro], requires: [note], four_eyes: true}
  - {from: escalated, to: discounted, label: Discount after review, roles: [mlro], requires: [note]}
sla:
  clock: OFAC blocked-property report
  due_days: 10
agents:
  on_create: [data_assembly, sanctions_adjudicator, qa_critic]
  autonomy: L2
