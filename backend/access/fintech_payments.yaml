# Starting policy of the 'Payments fintech' template: a lean team where people hold more than one role.
# Each client gets its own copy at onboarding and changes it from the Access page.
policy: payments-fintech
version: 1.0.0

permissions:
  work: Work cases - claim, complete tasks, write narratives, raise information requests
  view_team: See team workload, queue backlogs and QA results
  reassign: Reassign cases between members of a queue
  run_timers: Run the stage-clock sweep on demand
  publish_workflow: Publish new versions of case types
  load_data: Load data feeds onto the platform
  manage_access: Manage access - change the roles, queues and people in this policy
  manage_agents: Manage agents - set autonomy, switch agents off, run evaluations and batch reviews
  view_restricted: See restricted cases - matters hidden from everyone else, whatever their role
  restrict_case: Restrict a case, or lift a restriction
  resolve_entities: Resolve entities - decide whether two records are the same customer or counterparty
  submit_filings: Send regulatory reports - prepare, send, record the regulator's answer and amend
  approve_risk: Approve a lower customer risk rating proposed by someone else
  manage_lists: Manage screening lists - load a new version, edit the client's own list, switch a list on or off
  sanctions_decisions: Decide sanctions matters - approve the release or blocking of a held payment, and approve a false-match exemption
  info_sharing: Handle law enforcement search requests - see them, search, decide matches and answer
  tune_detection: Tune detection - propose scenario settings with a backtest, and plan and run lookback projects
  approve_tuning: Approve detection changes - put a proposed scenario change live, and sign off a lookback
  certify_access: Recertify access - start a review of who holds what, and decide whether each person keeps it

queues:
  fraud: Fraud claims
  fraud-approval: Refund sign-off
  aml-l1: Monitoring alerts
  aml-l2: Investigations
  mlro: MLRO review
  senior-approval: Chief risk officer sign-off
  sanctions-l1: Sanctions screening
  sanctions-l2: Sanctions decisions

# Each role can be limited in what it sees: sees: {scope: all | queues | own, case_types: [...]}. A role with no
# 'sees' sees every case. Whatever the limit, people keep sight of cases they own or have acted on, and a person
# with several roles sees what any of them shows. Restricted cases need 'view_restricted' on top.
roles:
  fraud_analyst:     {title: Fraud analyst, permissions: [work], sees: {scope: all, case_types: [fraud_claim]}}
  analyst:           {title: Alert analyst, permissions: [work], sees: {scope: queues}}
  investigator:      {title: Investigator, permissions: [work, reassign, resolve_entities], sees: {scope: all, case_types: [tm_alert_investigation]}}
  sanctions_officer: {title: Sanctions officer, permissions: [work, sanctions_decisions], sees: {scope: all, case_types: [sanctions_hit]}}
  team_lead:         {title: Operations lead, permissions: [work, view_team, reassign, run_timers, resolve_entities]}
  mlro:              {title: MLRO, permissions: [work, view_team, view_restricted, restrict_case, submit_filings, approve_risk, manage_lists, sanctions_decisions, info_sharing, tune_detection, approve_tuning, certify_access]}
  head_fiu:          {title: Chief risk officer, permissions: [work, view_team, manage_agents, view_restricted, restrict_case, resolve_entities, submit_filings, approve_risk, manage_lists, sanctions_decisions, info_sharing, tune_detection, approve_tuning, certify_access]}
  admin:             {title: Operations engineer, permissions: [view_team, publish_workflow, run_timers, load_data, manage_access, manage_agents, resolve_entities, manage_lists, tune_detection]}
  restricted_matters: {title: Restricted matters team, permissions: [view_restricted], sees: {scope: own}}
  auditor:           {title: External auditor, permissions: [view_team, view_restricted], read_only: true}

people:
  - {id: nia, name: Nia Okoye, roles: [fraud_analyst, analyst], title: Financial crime analyst, queues: [fraud, aml-l1, sanctions-l1],
     about: Works fraud claims and takes the first look at monitoring alerts and sanctions hits.}
  - {id: dev, name: Dev Malhotra, role: fraud_analyst, queues: [fraud],
     about: Works fraud claims against the clock and contacts customers.}
  - {id: ravi, name: Ravi Shah, roles: [investigator, sanctions_officer], title: Senior investigator, queues: [aml-l2, sanctions-l2],
     about: Runs investigations and decides escalated sanctions matches.}
  - {id: cleo, name: Cleo Martin, roles: [investigator, restricted_matters], title: Investigator, queues: [aml-l2],
     about: Second investigator, so four-eyes controls have someone to balance against.}
  - {id: joy, name: Joy Tanaka, roles: [mlro, team_lead], title: Head of compliance (MLRO), queues: [mlro, fraud-approval],
     about: Files SARs, signs off larger refunds and balances the team's workload.}
  - {id: sam, name: Sam Whitaker, role: head_fiu, queues: [senior-approval],
     about: Second approval for high-value and politically exposed filings.}
  - {id: pat, name: Pat Novak, role: admin, queues: [],
     about: Loads data, publishes workflow versions and maintains the access policy.}
  - {id: eli, name: Eli Brandt, role: auditor, queues: [],
     about: Read-only access for the annual independent review.}

default_person: nia
