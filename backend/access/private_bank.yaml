# Starting policy of the 'Private bank' template: due diligence first, with a read-only role for private bankers.
# Each client gets its own copy at onboarding and changes it from the Access page.
policy: private-bank
version: 1.0.0

permissions:
  work: Work cases - claim, complete tasks, write narratives, raise information requests
  view_team: See team workload, queue backlogs and QA results
  reassign: Reassign cases between members of a queue
  run_timers: Run the stage-clock sweep on demand
  publish_workflow: Publish new versions of case types
  load_data: Load data feeds onto the platform
  manage_access: Manage access - change the roles, queues and people in this policy

queues:
  kyc: Client due diligence
  kyc-edd: Enhanced due diligence committee
  aml-l1: Monitoring alerts
  aml-l2: Investigations
  mlro: MLRO review
  senior-approval: Head of financial crime approval
  sanctions-l1: Sanctions screening
  sanctions-l2: Sanctions officer review
  qa: Quality assurance

roles:
  kyc_analyst:          {title: Due diligence analyst, permissions: [work]}
  team_lead:            {title: Head of client due diligence, permissions: [work, view_team, reassign, run_timers]}
  analyst:              {title: Alert analyst, permissions: [work]}
  investigator:         {title: Investigator, permissions: [work]}
  sanctions_officer:    {title: Sanctions officer, permissions: [work]}
  qa_reviewer:          {title: QA reviewer, permissions: [work, view_team]}
  mlro:                 {title: MLRO, permissions: [work, view_team, reassign]}
  head_fiu:             {title: Head of financial crime, permissions: [work, view_team, reassign]}
  relationship_manager: {title: Private banker, permissions: [], read_only: true}
  admin:                {title: Platform admin, permissions: [view_team, publish_workflow, run_timers, load_data, manage_access]}
  auditor:              {title: Internal auditor, permissions: [view_team], read_only: true}

people:
  - {id: mira, name: Mira Solberg, role: kyc_analyst, queues: [kyc],
     about: Onboards clients and runs periodic reviews.}
  - {id: theo, name: Theo Varga, role: kyc_analyst, queues: [kyc],
     about: Second due diligence analyst.}
  - {id: ines, name: Ines Carvalho, role: team_lead, queues: [kyc-edd],
     about: Chairs enhanced due diligence and balances the team's workload.}
  - {id: beth, name: Beth Larkin, role: analyst, queues: [aml-l1, sanctions-l1],
     about: Triages monitoring alerts and first-line sanctions hits.}
  - {id: carl, name: Carl Jensen, role: investigator, queues: [aml-l2],
     about: Runs full investigations and drafts SAR narratives.}
  - {id: dana, name: Dana Whitfield, role: investigator, queues: [aml-l2],
     about: Second investigator.}
  - {id: noel, name: Noel Adair, role: sanctions_officer, queues: [sanctions-l1, sanctions-l2],
     about: Decides escalated sanctions matches.}
  - {id: vera, name: Vera Lindholm, role: mlro, queues: [mlro, kyc-edd],
     about: Approves and files SARs and sits on the enhanced due diligence committee.}
  - {id: lars, name: Lars Engel, role: head_fiu, queues: [senior-approval],
     about: Second approval for high-value and politically exposed filings.}
  - {id: june, name: June Abara, role: qa_reviewer, queues: [qa],
     about: Reviews a sample of closed cases and can send them back.}
  - {id: gwen, name: Gwen Ashby, role: relationship_manager, queues: [],
     about: Sees the cases on her clients. Cannot change anything.}
  - {id: otto, name: Otto Reinhardt, role: admin, queues: [],
     about: Loads data, publishes workflow versions and maintains the access policy.}
  - {id: ruth, name: Ruth Okafor, role: auditor, queues: [],
     about: Read-only access to every case, decision and audit trail.}

default_person: mira
