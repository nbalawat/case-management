# Starting policy of the 'Private bank' template: due diligence first, with a read-only role for private bankers.
# Each client gets its own copy at onboarding and changes it from the Access page.
policy: private-bank
version: 1.0.0

permissions:
  work: Work cases - claim, complete tasks, write narratives, raise information requests
  view_team: See team workload, queue backlogs and QA results
  reassign: Reassign cases between members of a queue
  run_timers: Run the stage-clock sweep on demand
  publish_workflow: Publish new versions of case types
  load_data: Load data feeds onto the platform
  manage_access: Manage access - change the roles, queues and people in this policy
  manage_agents: Manage agents - set autonomy, switch agents off, run evaluations and batch reviews
  view_restricted: See restricted cases - matters hidden from everyone else, whatever their role
  restrict_case: Restrict a case, or lift a restriction
  resolve_entities: Resolve entities - decide whether two records are the same customer or counterparty
  submit_filings: Send regulatory reports - prepare, send, record the regulator's answer and amend
  approve_risk: Approve a lower customer risk rating proposed by someone else
  manage_lists: Manage screening lists - load a new version, edit the client's own list, switch a list on or off
  sanctions_decisions: Decide sanctions matters - approve the release or blocking of a held payment, and approve a false-match exemption
  info_sharing: Handle law enforcement search requests - see them, search, decide matches and answer
  tune_detection: Tune detection - propose scenario settings with a backtest, and plan and run lookback projects
  approve_tuning: Approve detection changes - put a proposed scenario change live, and sign off a lookback
  certify_access: Recertify access - start a review of who holds what, and decide whether each person keeps it
  break_glass: Break glass - open one case or customer you cannot otherwise see, for a stated reason, for a few hours; every opening is reviewed afterwards

queues:
  kyc: Client due diligence
  kyc-edd: Enhanced due diligence committee
  aml-l1: Monitoring alerts
  aml-l2: Investigations
  mlro: MLRO review
  senior-approval: Head of financial crime approval
  sanctions-l1: Sanctions screening
  sanctions-l2: Sanctions officer review
  qa: Quality assurance

# Each role can be limited in what it sees: sees: {scope: all | queues | own, case_types: [...]}. A role with no
# 'sees' sees every case. Whatever the limit, people keep sight of cases they own or have acted on, and a person
# with several roles sees what any of them shows. Restricted cases need 'view_restricted' on top.
roles:
  kyc_analyst:          {title: Due diligence analyst, permissions: [work], sees: {scope: all, case_types: [kyc_onboarding, kyc_refresh]}}
  team_lead:            {title: Head of client due diligence, permissions: [work, view_team, reassign, run_timers, resolve_entities]}
  analyst:              {title: Alert analyst, permissions: [work], sees: {scope: queues}}
  investigator:         {title: Investigator, permissions: [work, resolve_entities, break_glass], sees: {scope: all, case_types: [tm_alert_investigation]}}
  sanctions_officer:    {title: Sanctions officer, permissions: [work, sanctions_decisions], sees: {scope: all, case_types: [sanctions_hit]}}
  qa_reviewer:          {title: QA reviewer, permissions: [work, view_team]}
  mlro:                 {title: MLRO, permissions: [work, view_team, reassign, view_restricted, restrict_case, submit_filings, approve_risk, manage_lists, sanctions_decisions, info_sharing, tune_detection, approve_tuning, certify_access]}
  head_fiu:             {title: Head of financial crime, permissions: [work, view_team, reassign, manage_agents, view_restricted, restrict_case, resolve_entities, submit_filings, approve_risk, manage_lists, sanctions_decisions, info_sharing, tune_detection, approve_tuning, certify_access]}
  relationship_manager: {title: Private banker, permissions: [], read_only: true, customer_facing: true, customers: {book: own},
                         sees: {scope: all, case_types: [kyc_onboarding, kyc_refresh]}}
  admin:                {title: Platform admin, permissions: [view_team, publish_workflow, run_timers, load_data, manage_access, manage_agents, resolve_entities, manage_lists, tune_detection]}
  restricted_matters: {title: Restricted matters team, permissions: [view_restricted], sees: {scope: own}}
  auditor:              {title: Internal auditor, permissions: [view_team, view_restricted], read_only: true}

# The platform provider's managed-service team may work here. Each engagement names one member of their staff, the
# roles and queues they hold (only from the list below; never access control) and an end date, and waits for someone
# here with manage_access to approve it. Steps under client_signoff need one of this client's own people as checker.
managed_service:
  provider: CaseForge Managed Services
  roles: [kyc_analyst, analyst, investigator]
  approval: client
  max_days: 180
  client_signoff: [four_eyes, submit_filings]

# Tipping-off: customer-facing roles never see these case types or any regulatory report, even for their own customers.
tipping_off: {case_types: [tm_alert_investigation, sanctions_hit], filings: hidden}

# Break-glass: holders of the break_glass permission can open one case or customer they cannot otherwise see, for a
# stated reason, for this many hours. Someone else reviews every opening afterwards. Restricted cases stay closed.
break_glass: {hours: 2, restricted: false}

people:
  - {id: mira, name: Mira Solberg, role: kyc_analyst, queues: [kyc],
     about: Onboards clients and runs periodic reviews.}
  - {id: theo, name: Theo Varga, role: kyc_analyst, queues: [kyc],
     about: Second due diligence analyst.}
  - {id: ines, name: Ines Carvalho, role: team_lead, queues: [kyc-edd],
     about: Chairs enhanced due diligence and balances the team's workload.}
  - {id: beth, name: Beth Larkin, role: analyst, queues: [aml-l1, sanctions-l1],
     about: Triages monitoring alerts and first-line sanctions hits.}
  - {id: carl, name: Carl Jensen, role: investigator, queues: [aml-l2],
     about: Runs full investigations and drafts SAR narratives.}
  - {id: dana, name: Dana Whitfield, roles: [investigator, restricted_matters], title: Investigator, queues: [aml-l2],
     about: Second investigator.}
  - {id: noel, name: Noel Adair, role: sanctions_officer, queues: [sanctions-l1, sanctions-l2],
     about: Decides escalated sanctions matches.}
  - {id: vera, name: Vera Lindholm, role: mlro, queues: [mlro, kyc-edd],
     about: Approves and files SARs and sits on the enhanced due diligence committee.}
  - {id: lars, name: Lars Engel, role: head_fiu, queues: [senior-approval],
     about: Second approval for high-value and politically exposed filings.}
  - {id: june, name: June Abara, role: qa_reviewer, queues: [qa],
     about: Reviews a sample of closed cases and can send them back.}
  - {id: gwen, name: Gwen Ashby, role: relationship_manager, queues: [],
     about: Sees onboarding and reviews for her own clients only. Never sees an investigation, a sanctions hit or a report.}
  - {id: otto, name: Otto Reinhardt, role: admin, queues: [],
     about: Loads data, publishes workflow versions and maintains the access policy.}
  - {id: ruth, name: Ruth Okafor, role: auditor, queues: [],
     about: Read-only access to every case, decision and audit trail.}

default_person: mira
