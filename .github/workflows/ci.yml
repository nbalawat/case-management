name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  services:
    name: Backend on Postgres, Kafka, OpenSearch, Apache AGE and Temporal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caseforge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: caseforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseforge" --health-interval 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health" --health-interval 5s --health-retries 40
      graph:
        image: apache/age:release_PG16_1.5.0
        env:
          POSTGRES_USER: caseforge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: graph
        ports: ["5455:5432"]
        options: >-
          --health-cmd "pg_isready -U caseforge -d graph" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start a Temporal development server
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.10.1 server start-dev --ip 0.0.0.0
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null && break; sleep 1; done
          sleep 5
          docker logs temporal | tail -5
      - name: The whole demo on Postgres, the event backbone on a real broker, search on a real engine
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://caseforge:ci-only@localhost:5432/caseforge
          TEST_KAFKA_URL: kafka://localhost:9092
          TEST_OPENSEARCH_URL: opensearch://localhost:9200
          TEST_AGE_URL: age://caseforge:ci-only@localhost:5455/graph
          TEST_TEMPORAL_URL: temporal://localhost:7233
        run: uv run pytest -q tests/test_postgres.py tests/test_kafka.py tests/test_opensearch.py tests/test_age.py tests/test_temporal.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint --if-present
      - working-directory: frontend
        run: npm run build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile backbone --profile cdc --profile search --profile graph --profile durable --profile streaming config -q

  helm:
    name: Helm chart renders in every deployment mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Lint and render
        working-directory: deploy/helm/caseforge
        run: |
          set -euo pipefail
          ARGS="--set existingSecret=caseforge-secrets --set storage.evidenceUrl=s3://bucket/evidence --set ingress.host=cases.example.com"
          helm lint . $ARGS
          for mode in saas dedicated client-cloud air-gapped; do
            helm template stamp . -f modes/$mode.yaml $ARGS --set eventBus.url=kafka://kafka:9092 --set temporal.url=temporal://temporal:7233 > /tmp/$mode.yaml
            grep -c '^kind:' /tmp/$mode.yaml
          done
          # What the chart must refuse
          refuse() { if helm template stamp . "$@" > /dev/null 2>&1; then echo "should have refused: $*"; exit 1; fi; }
          refuse --set storage.evidenceUrl=s3://b/e
          refuse --set existingSecret=s
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set schemaOnMismatch=rebuild
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set auth.mode=demo --set ingress.enabled=true --set ingress.host=h
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set eventBus.url=broker:9092
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set temporal.url=temporal:7233
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set ingress.enabled=true
          # And the least it must accept
          helm template stamp . --set existingSecret=s --set storage.evidenceUrl=s3://b/e > /dev/null
          helm template demo . --set existingSecret=s --set demoTenants=true --set schemaOnMismatch=rebuild --set auth.mode=demo > /dev/null
