name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The two whole-suite jobs run every test, spread over the runner's cores by pytest-xdist. --dist loadfile keeps
  # each test file on one worker, so a file's module-scoped fixtures (the seeded app behind `client`) are built once
  # and its tests run in the order they always have. Every worker has its own temporary directories, in-memory
  # databases and (on Temporal) its own task queue and namespace prefix, so workers share nothing. --durations
  # names the slowest tests, so the next speed-up is measured rather than guessed. The services job stays serial:
  # its tests share one Postgres, one broker and one search engine.
  PYTEST_PARALLEL: -n auto --dist loadfile --durations=15

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Every model change has a migration
        working-directory: backend
        run: uv run python -m app.migrate check
      - name: Test
        working-directory: backend
        run: uv run pytest -q $PYTEST_PARALLEL

  backend-temporal:
    name: Backend tests with case workflows on Temporal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: temporal  # its own cache, like the services job
      - name: Start a Temporal development server
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.10.1 server start-dev --ip 0.0.0.0
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null && break; sleep 1; done
          sleep 5
      - name: The whole suite, every person's step through the API applied by a case workflow
        working-directory: backend
        env:
          TEST_WORKFLOW_ENGINE: temporal
          TEST_TEMPORAL_URL: temporal://localhost:7233
          TEST_TEMPORAL_NAMESPACES: per_client
        run: uv run pytest -q $PYTEST_PARALLEL --ignore=tests/test_temporal.py

  services:
    name: Backend on Postgres, Kafka, OpenSearch, Apache AGE and Temporal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caseforge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: caseforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseforge" --health-interval 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health" --health-interval 5s --health-retries 40
      graph:
        image: apache/age:release_PG16_1.5.0
        env:
          POSTGRES_USER: caseforge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: graph
        ports: ["5455:5432"]
        options: >-
          --health-cmd "pg_isready -U caseforge -d graph" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: services  # its own cache, so this job and the SQLite job never race to save one
      - name: Start a Temporal development server
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.10.1 server start-dev --ip 0.0.0.0
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null && break; sleep 1; done
          sleep 5
          docker logs temporal | tail -5
      - name: Start an OpenBao development server with the Transit engine (per-client keys)
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK openbao/openbao:2.7.3 server -dev -dev-root-token-id=ci-only -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
          curl -sf -X POST -H "X-Vault-Token: ci-only" -d '{"type":"transit"}' http://127.0.0.1:8200/v1/sys/mounts/transit
      - name: The whole demo on Postgres, the event backbone on a real broker, search on a real engine
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://caseforge:ci-only@localhost:5432/caseforge
          TEST_KAFKA_URL: kafka://localhost:9092
          TEST_OPENSEARCH_URL: opensearch://localhost:9200
          TEST_AGE_URL: age://caseforge:ci-only@localhost:5455/graph
          TEST_TEMPORAL_URL: temporal://localhost:7233
          TEST_TRANSIT_ADDR: http://localhost:8200
          TEST_TRANSIT_TOKEN: ci-only
        run: uv run pytest -q tests/test_postgres.py tests/test_rls.py tests/test_keys.py tests/test_kafka.py tests/test_opensearch.py tests/test_age.py tests/test_temporal.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint --if-present
      - working-directory: frontend
        run: npm run build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile backbone --profile cdc --profile search --profile graph --profile durable --profile streaming config -q

  helm:
    name: Helm chart renders in every deployment mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Lint and render
        working-directory: deploy/helm/caseforge
        run: |
          set -euo pipefail
          ARGS="--set existingSecret=caseforge-secrets --set storage.evidenceUrl=s3://bucket/evidence --set ingress.host=cases.example.com --set keys.transit.addr=https://openbao:8200"
          helm lint . $ARGS
          for mode in saas dedicated client-cloud air-gapped; do
            helm template stamp . -f modes/$mode.yaml $ARGS --set eventBus.url=kafka://kafka:9092 --set temporal.url=temporal://temporal:7233 > /tmp/$mode.yaml
            grep -c '^kind:' /tmp/$mode.yaml
          done
          # What the chart must refuse
          refuse() { if helm template stamp . "$@" > /dev/null 2>&1; then echo "should have refused: $*"; exit 1; fi; }
          refuse --set storage.evidenceUrl=s3://b/e --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set schemaOnMismatch=rebuild --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set auth.mode=demo --set ingress.enabled=true --set ingress.host=h --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set eventBus.url=broker:9092 --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set temporal.url=temporal:7233 --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set temporal.encryption=sometimes --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set temporal.keyVersion=0 --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set ingress.enabled=true --set keys.transit.addr=https://bao:8200
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e                                   # no key service
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set keys.provider=local --set keys.transit.addr=x
          refuse --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set keys.provider=none
          # Migrations: a hook job by default and pods that wait for it; without the job, pods migrate themselves
          helm template stamp . $ARGS | grep -q 'helm.sh/hook: pre-install,pre-upgrade'
          helm template stamp . $ARGS | grep -q 'MIGRATE_ON_START: "0"'
          helm template stamp . $ARGS --set migrations.job=false | grep -q 'MIGRATE_ON_START: "1"'
          if helm template stamp . $ARGS --set migrations.job=false | grep -q 'helm.sh/hook'; then echo "no hook expected"; exit 1; fi
          # Offboarding bundles sit beside the documents unless placed elsewhere
          helm template stamp . $ARGS | grep -q 'EXPORTS_URL: "s3://bucket/evidence-exports"'
          helm template stamp . $ARGS --set storage.exportsUrl=s3://vault/exports | grep -q 'EXPORTS_URL: "s3://vault/exports"'
          # And the least it must accept
          helm template stamp . --set existingSecret=s --set storage.evidenceUrl=s3://b/e --set keys.transit.addr=https://bao:8200 > /dev/null
          helm template demo . --set existingSecret=s --set demoTenants=true --set schemaOnMismatch=rebuild --set auth.mode=demo > /dev/null

  image:
    name: Image builds and starts as a non-root user
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t caseforge:ci .
      - name: Start as the user Kubernetes runs the pods as
        run: |
          set -euo pipefail
          docker run -d --name app --user 10001:10001 -p 8000:8000 caseforge:ci
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/api/tenants > /dev/null; then echo "answered after $((i * 5)) s"; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then docker logs app | tail -60; echo "the app stopped"; exit 1; fi
            sleep 5
          done
          curl -sf http://localhost:8000/api/tenants > /dev/null
          test "$(docker exec app id -u)" = "10001"
          docker logs app | tail -5

  flink-image:
    name: Flink image builds with the name-matching function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t caseforge-flink:ci deploy/flink
      - name: The function is where Flink loads it from, and answers
        run: |
          set -euo pipefail
          docker run --rm caseforge-flink:ci bash -c 'ls -l /opt/flink/lib/caseforge-udf.jar /opt/flink/lib/flink-sql-connector-kafka-*.jar'
          answer=$(printf 'ratio\tDarya Shiping Lines\tDarya Shipping Lines\n' | docker run --rm -i caseforge-flink:ci java -cp '/opt/flink/lib/*' caseforge.Check)
          echo "$answer"
          test "$answer" = "0.9743589743589743"

